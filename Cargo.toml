[package]
name = "sm3lgs"
version = "0.1.0"
edition = "2021"
description = "Auto-configure Supermodel3 emulator by automatically selecting connected lightguns via USB VID:PID matching and updating the configuration"

[dependencies]
rusb = "0.9"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "sm3lgs"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
