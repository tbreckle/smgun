[package]
name = "smgun"
version = "0.1.0"
edition = "2021"
description = "Auto-configure Supermodel emulator by automatically selecting connected lightguns via USB VID:PID matching and updating the configuration"

[dependencies]
anstream = "1.0"
clap = { version = "4.6", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"

[target.'cfg(not(windows))'.dependencies]
rusb = "0.9.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input",
] }

[[bin]]
name = "smgun"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
