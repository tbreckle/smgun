name: Build

# Reusable build of smgun with an injected version (see scripts/version.sh).
# Called by ci.yml for every push/PR and by release-finish.yml for official releases.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to inject, e.g. 1.2.0, 1.2.0-rc.3 or 0.0.0+abc1234"
        required: true
        type: string
      ref:
        description: "Commit to build (defaults to the commit of the calling event)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: zip
    env:
      SMGUN_VERSION: ${{ inputs.version }}
      PACKAGE: smgun-${{ inputs.version }}-${{ matrix.name }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      # Toolchain, components and targets from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      # Archive on the runner: upload-artifact drops the executable bit.
      - name: Package
        run: |
          rm -rf dist
          mkdir -p "dist/$PACKAGE"
          cp LICENSE README.md "dist/$PACKAGE/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/smgun.exe "dist/$PACKAGE/"
            (cd dist && pwsh -NoProfile -Command "Compress-Archive -Path '$PACKAGE' -DestinationPath '$PACKAGE.zip'")
          else
            cp target/release/smgun "dist/$PACKAGE/"
            tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.${{ matrix.archive }}
          if-no-files-found: error

  # Both targets from Linux: the Windows path (Raw Input) only needs windows-sys, which
  # type-checks without the MSVC toolchain.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run clippy (Linux)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run clippy (Windows)
        run: cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt -- --check

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

      - name: Test version and changelog scripts
        run: scripts/test.sh
